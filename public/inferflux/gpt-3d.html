<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://bbycroft.net; connect-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPT 架构 3D 透视 · bbycroft/llm</title>
<style>
:root{ --bg:#0d1117; --panel:#161b22; --border:#2d3646; --text:#e6edf3;
  --muted:#8b98a9; --accent:#4ea1ff; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--text); overflow:hidden;
  font-family:-apple-system,"SF Pro","Segoe UI",Roboto,"PingFang SC",sans-serif;
  display:flex; flex-direction:column;}
.topbar{flex-shrink:0; display:flex; align-items:center; gap:12px;
  padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--border);}
.topbar .home{color:var(--muted); font-size:12px; text-decoration:none; white-space:nowrap;}
.topbar .home:hover{color:var(--accent);}
.topbar .brand{display:flex; align-items:baseline; gap:8px; overflow:hidden;}
.topbar .brand h1{font-size:14px; font-weight:700; white-space:nowrap;}
.topbar .brand .sub{color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .right{margin-left:auto; display:flex; gap:8px;}
.topbar .right a{color:var(--muted); font-size:12px; text-decoration:none; white-space:nowrap;}
.topbar .right a:hover{color:var(--accent);}
#frame{flex:1; width:100%; border:none; background:#fff;}
@media (max-width:720px){
  .topbar .brand .sub{display:none;}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="/" target="_top">← 首页</a>
  <div class="brand">
    <h1>GPT 架构 3D 透视</h1>
    <span class="sub">bbycroft/llm-viz · 在线交互可视化</span>
  </div>
  <div class="right">
    <a href="https://bbycroft.net/llm" target="_blank" rel="noreferrer">↗ 原始站点</a>
  </div>
</div>
<iframe id="frame" src="https://bbycroft.net/llm"
  title="bbycroft LLM Visualization" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
