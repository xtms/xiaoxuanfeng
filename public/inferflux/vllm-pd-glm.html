<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=820, viewport-fit=cover">
<title>vLLM P/D 分离模拟器 · GLM5.1 请求链路</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3646;
  --text:#e6edf3; --muted:#8b98a9; --accent:#4ea1ff;
  --amber:#f0b429; --grey:#7d8590; --blue:#4ea1ff; --green:#3fb950;
  --purple:#bc8cff; --red:#f85149; --cyan:#39c5cf; --orange:#f0883e;
  --radius:10px; --sidebar-w:300px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,"SF Pro","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px; overflow:hidden;
}
button,select,input{font-family:inherit; font-size:12px; color:var(--text);}
button{
  background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  padding:4px 10px; cursor:pointer; white-space:nowrap;
}
button:hover{border-color:var(--accent);}
button.active{background:var(--accent); color:#04121f; border-color:var(--accent); font-weight:600;}
select{background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:3px 6px;}

/* ---- top bar ---- */
#topbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel);
}
#topbar .title{font-size:15px; font-weight:700; margin-right:6px;}
#topbar .title small{color:var(--muted); font-weight:400; font-size:11px;}
#topbar .home{color:var(--muted); font-size:12px; text-decoration:none; margin-right:4px;}
#topbar .home:hover{color:var(--accent);}
#topbar .gh-link{display:inline-flex; align-items:center; color:var(--muted); margin-left:auto; transition:color .18s;}
#topbar .gh-link:hover{color:var(--accent);}
#topbar .sep{width:1px; height:20px; background:var(--border); margin:0 2px;}
#speedWrap{display:flex; align-items:center; gap:6px;}
#speedWrap input[type=range]{width:110px;}
#speedVal{min-width:44px; color:var(--accent); font-variant-numeric:tabular-nums;}
#simClock{color:var(--muted); font-variant-numeric:tabular-nums; min-width:88px;}
#presetWrap{display:flex; gap:6px; align-items:center;}
#sidebarToggle{display:inline-block;}

/* ---- layout ---- */
#layout{display:flex; height:calc(100% - 45px);}
#sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  overflow-y:auto; border-right:1px solid var(--border); background:var(--panel);
  padding:10px 12px 40px;
  transition:width .2s ease, min-width .2s ease, padding .2s ease;
}
#main{flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto; padding:10px;}

/* ---- sidebar params ---- */
.pgroup{margin-bottom:14px;}
.pgroup h3{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--muted); border-bottom:1px solid var(--border);
  padding-bottom:4px; margin-bottom:8px;
}
.prow{margin-bottom:9px;}
.prow .plabel{display:flex; justify-content:space-between; margin-bottom:2px;}
.prow .plabel .pname{color:var(--text);}
.prow .plabel .pval{color:var(--accent); font-variant-numeric:tabular-nums;}
.prow input[type=range]{width:100%; accent-color:var(--accent); height:18px;}
.prow select{width:100%;}
.pinfo{
  background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  padding:6px 8px; font-size:11px; color:var(--muted); line-height:1.6;
}
.pinfo b{color:var(--cyan); font-variant-numeric:tabular-nums;}

/* ---- flow canvas ---- */
#flowWrap{position:relative; width:100%;}
#flow{
  width:100%; display:block; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius);
}

/* ---- breakdown ---- */
#bdWrap{margin-top:10px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px;}
#bdWrap h3{font-size:12px; color:var(--muted); margin-bottom:6px;}
#bd{width:100%; height:86px; display:block;}

/* ---- metric cards ---- */
#metrics{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px; margin-top:10px;
}
.mcard{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:8px 10px 6px;
}
.mcard .mtitle{font-size:11px; color:var(--muted); margin-bottom:2px;}
.mcard .mval{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
.mcard .mval small{font-size:10px; color:var(--muted); font-weight:400;}
.mcard .msub{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:2px; min-height:12px;}
.mcard canvas{width:100%; height:34px; display:block;}

/* sidebar collapse — works at any width; the flow canvas reflows to fill
   the freed space on the next frame (renderer.resize reads clientWidth). */
#sidebar.collapsed{
  width:0; min-width:0; padding-left:0; padding-right:0;
  border-right:0; overflow:hidden;
}
/* narrow (mobile) viewport: slimmer sidebar so the flow gets more room */
@media (max-width:820px){
  :root{ --sidebar-w:200px; }
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>

<script>
"use strict";
/* =====================================================================
 *  vLLM P/D 分离推理模拟器 — single-file, zero-dependency web app.
 *  模拟 vLLM 框架下 P/D 分离部署 GLM5.1 的完整请求链路:
 *    请求进入(tokenize) → 路由分发(Router调度+P节点/D节点双路下发) →
 *    P节点处理(chunked prefill, 计算生成 KV cache) →
 *    D节点缓存拉起(KV Connector 将 KV cache 传输/复用到 D 节点) →
 *    D节点处理(continuous batching decode, 逐 token 生成) → 响应返回
 *  核心: 自动 prefix-cache 命中(APC) 命中部分免计算免传输 → 缓存拉起更快;
 *        cache miss 部分由 P 节点计算后经 KV Connector 拉到 D 节点。
 *  指标(TTFT/TPOT/E2E)从模拟事件时间戳测量, 不用闭合公式。
 * ===================================================================== */

let LANG = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
function t(k){ return (DICT[LANG][k] !== undefined) ? DICT[LANG][k] : k; }

/* ======================= PARAMS & PRESETS ============================ */
/* GLM5.1 模型预设 (GQA 架构): 每个请求的 KV cache 逐 token 增长只与全注意力层有关,
   cell size = layers·kvHeads·headDim·dtype·2。MoE 版本只按激活参数量计 decode 带宽。 */
const MODEL_PRESETS = {
  glm51_9b:   {layers:40, kvHeads:4,  headDim:128, dtypeBytes:2, mla:false, activeB:9,  qHeads:32},
  glm51_32b:  {layers:64, kvHeads:4,  headDim:128, dtypeBytes:2, mla:false, activeB:32, qHeads:40},
  glm51_230b: {layers:76, kvHeads:2,  headDim:128, dtypeBytes:2, mla:false, activeB:37, qHeads:64},
};

/* GPU presets: hbm (GB), bf16 dense TFLOP/s, HBM bandwidth (TB/s). Selecting one
   sets the KV budget (≈70% of HBM). H800 为国产算力常见卡(H100 同算力)。 */
const GPU_PRESETS = {
  a100_80g:{hbm:80,  tflops:312,  bwTBs:2.0},
  h100:    {hbm:80,  tflops:990,  bwTBs:3.35},
  h800:    {hbm:80,  tflops:990,  bwTBs:3.35},
  h200:    {hbm:141, tflops:990,  bwTBs:4.8},
  b200:    {hbm:192, tflops:2250, bwTBs:8.0},
  b300:    {hbm:288, tflops:2250, bwTBs:8.0},
  mi300x:  {hbm:192, tflops:1300, bwTBs:5.3},
};
const gpuKvBudget = hbm => Math.round(hbm * 0.7);
const PERREQ_REF_CTX = 4096;      // reference context length decodeMsPerReq is calibrated to

const DEFAULTS = {
  qps:4, arrivalDist:"poisson", inputLenMean:2048, inputDist:"lognormal",
  outputLenMean:256, outputDist:"lognormal", cacheHitRate:0.9,
  numP:2, numD:2, lbPolicyP:"least", lbPolicyD:"least",
  tokenizeUsPerTok:1, cacheReadMs:5, detokenizeMs:2,
  activeB:9, prefillTokPerSec:20000, chunkSize:8192,
  decodeMsBase:20, decodeMsPerReq:0.15, maxRunning:64, newTokenRatio:0.2,
  modelPreset:"glm51_9b", gpu:"h200",
  layers:40, kvHeads:4, headDim:128, dtypeBytes:2, hybrid:false,
  mla:false, kvLoraRank:512, qkRope:64, qHeads:32, swaWindow:0,
  kvGbP:99, kvGbD:99, bandwidthGBs:50,
  kvReadGBs:100,                       // KV Store 读取带宽(命中 KV 从缓存存储拉取)
};

const PRESETS = {
  balanced: {...DEFAULTS},
  cacheHit: {...DEFAULTS, qps:5, inputLenMean:8192, outputLenMean:128, cacheHitRate:0.98,
             bandwidthGBs:80, cacheReadMs:2},
  prefillBound: {...DEFAULTS, qps:12, inputLenMean:6144, cacheHitRate:0.1,
                 prefillTokPerSec:8000, numP:1, numD:2, bandwidthGBs:40},
  decodeSaturated: {...DEFAULTS, qps:10, inputLenMean:512, outputLenMean:1024,
                    maxRunning:24, numP:2, numD:1, decodeMsPerReq:0.4},
  kvReadBound: {...DEFAULTS, qps:8, inputLenMean:8192, outputLenMean:128, cacheHitRate:0.9,
                bandwidthGBs:80, cacheReadMs:5, kvReadGBs:5, numP:2, numD:2},

function fmtTokens(v){
  if (v >= 1e6) return (v / 1e6).toFixed(v % 1e6 === 0 ? 0 : 2) + "M";
  if (v >= 1e3) return (v / 1e3).toFixed(v % 1e3 === 0 ? 0 : 1) + "k";
  return v.toFixed(0);
}
/* log-scale slider: position ∈ [0,LOG_STEPS] ↔ value ∈ [min,max], snapped to a
   1/2/3/5/7 grid within each decade so dragging lands on tidy round token counts */
const LOG_STEPS = 1000;
const SNAP_GRID = [1, 2, 3, 5, 7, 10];
function logSliderToVal(def, pos){
  if (pos <= 0) return def.min;
  if (pos >= LOG_STEPS) return def.max;
  const lo = Math.log(def.min), hi = Math.log(def.max);
  const raw = Math.exp(lo + (hi - lo) * (pos / LOG_STEPS));
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const base = raw / mag;
  let snap = SNAP_GRID[0];
  for (const g of SNAP_GRID)
    if (Math.abs(Math.log(base / g)) < Math.abs(Math.log(base / snap))) snap = g;
  return Math.max(def.min, Math.min(def.max, Math.round(snap * mag)));
}
function nearestStepIdx(def, val){
  let idx = 0, best = Infinity;
  for (let i = 0; i < def.steps.length; i++){
    const d = Math.abs(def.steps[i] - val);
    if (d < best){ best = d; idx = i; }
  }
  return idx;
}
function logValToSlider(def, val){
  const lo = Math.log(def.min), hi = Math.log(def.max);
  return Math.max(0, Math.min(LOG_STEPS,
    Math.round((Math.log(val) - lo) / (hi - lo) * LOG_STEPS)));
}

/* ================= RNG & distributions (DOM-free engine below) ======= */
const TICK = 5;                 // ms of sim time per engine tick
const RING_MAX = 4096;          // completed-request ring for percentiles
const SERIES_LEN = 300;         // 300 × 1s buckets for sparklines
const BUCKET_MS = 1000;
/* vLLM admission/retraction analogs: new_token_ratio reserves KV headroom for
   in-flight decodes; it is raised on a retraction and decays back toward its
   floor (P.newTokenRatio) over NTR_DECAY_STEPS healthy decode steps. */
const NTR_MAX = 1.0;
const NTR_CLIP = 4096;         // cap on projected new tokens per request
const NTR_DECAY_STEPS = 600;
/* Router 向 P/D 双路下发的固定 RTT(调度往返)。真正的主导等待来自 D 侧
   KV 预分配(预分配成功才允许 P 传输/缓存拉起), 故不作为滑块暴露。 */
const ROUTE_RTT_MS = 2;

function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function expSample(rng, mean){ return -Math.log(1 - rng()) * mean; }
function lognormalSample(rng, mean, sigma){
  const mu = Math.log(mean) - sigma * sigma / 2;
  const u1 = rng(), u2 = rng();
  const z = Math.sqrt(-2 * Math.log(1 - u1)) * Math.cos(2 * Math.PI * u2);
  return Math.exp(mu + sigma * z);
}
function sampleLen(rng, mean, dist){
  let v;
  if (dist === "fixed") v = mean;
  else if (dist === "uniform") v = mean * (0.5 + rng());
  else v = lognormalSample(rng, mean, 0.5);
  return Math.max(1, Math.round(v));
}

/* KV cell size in bytes/token — per-token cost of one prompt token's KV cache.
   GQA(MHA 同构)按全部 layers 增长; MLA 仅按压缩低秩计。 */
function cellSizeOf(P){
  if (P.mla) return (P.kvLoraRank + P.qkRope) * P.layers * P.dtypeBytes;
  return P.layers * P.kvHeads * P.headDim * P.dtypeBytes * 2;
}

/* KV 状态机 — 映射 vLLM 的 KV Connector 状态: 握手 → 等待 → 传输(拉起) → 完成 */
const KVPOLL = { Bootstrapping:"Bootstrapping", WaitingForInput:"WaitingForInput",
                 Transferring:"Transferring", Success:"Success" };

/* ============================ Entities =============================== */
let REQ_SEQ = 0;
function makeRequest(engine, arrivalT){
  const P = engine.P, rng = engine.rng;
  const inputLen = sampleLen(rng, P.inputLenMean, P.inputDist);
  const outputLen = Math.max(2, sampleLen(rng, P.outputLenMean, P.outputDist));
  const hit = clamp(P.cacheHitRate + (rng() - 0.5) * 0.2, 0, 1);
  const cachedLen = Math.min(inputLen - 1, Math.round(inputLen * hit));
  return {
    id: REQ_SEQ++,
    room: Math.floor(rng() * 1e9),           // routing 配对标识
    inputLen, outputLen, cachedLen,
    uncachedLen: inputLen - cachedLen,       // prefix-cache miss: 需 P 计算并拉起
    stage: "tokenize", kvPoll: null,
    p: null, d: null,
    readyAt: Infinity,
    dReadyAt: Infinity,                       // D 侧路由握手完成时刻
    dPrealloc: false,
    chunksTotal: 0, chunksComputed: 0, chunksQueued: 0, chunksTransferred: 0,
    bytesTotal: 0, bytesDone: 0,
    /* KV Store 读取: 命中部分 KV 从缓存存储拉取(与 miss 传输并行), 全部到位才能 decode */
    hitBytes: Math.max(0, cachedLen) * cellSizeOf(P),
    hitDone: false,
    missDone: false,
    tokensOut: 0,
    retracted: false,
    stamps: { recv: arrivalT, tokenized: NaN, routingDone: NaN, pQueueExit: NaN,
              prefillDone: NaN, transferDone: NaN, preallocDone: NaN,
              missTransferDone: NaN, hitReadDone: NaN,
              dQueueExit: NaN, firstToken: NaN, lastToken: NaN, detokDone: NaN },
  };
}
function chunkTokens(engine, r, idx){
  return Math.min(engine.P.chunkSize, r.uncachedLen - idx * engine.P.chunkSize);
}
/* Wall-clock ms for one prefill chunk = GEMM (linear in tokens, via prefillTokPerSec)
   + attention (O(query-tokens × KV-length): each query token attends the whole prefix
   it can see — cache hits + prior chunks + this chunk's own average). */
function chunkPrefillMs(P, r, idx){
  const q = Math.min(P.chunkSize, r.uncachedLen - idx * P.chunkSize);
  const gemmMs = q / P.prefillTokPerSec * 1000;
  const effFlops = P.prefillTokPerSec * 2 * (P.activeB * 1e9);
  const flopsPerLayer = 4 * P.qHeads * P.headDim;
  const coefFull = flopsPerLayer * P.layers / effFlops * 1000;
  const ctx = r.cachedLen + idx * P.chunkSize + q / 2;   // avg KV length these q attend
  return gemmMs + coefFull * q * ctx;
}

class TransferLink {           // 每个 P 节点一条 KV Connector 出口链路
  constructor(){ this.queue = []; this.current = null; this.startAt = 0; this.doneAt = 0; }
  get depth(){ return this.queue.length + (this.current ? 1 : 0); }
}

class PrefillNode {            // P 节点: chunked prefill + KV 生成
  constructor(id){
    this.id = id;
    this.routingQ = [];        // 路由握手(等 tokenize + D 预分配信号)
    this.waitingQ = [];        // 调度器 waiting_queue
    this.slots = [];           // 一次一个 chunked prefill
    this.inflight = [];        // 已完成 prefill、等待 KV 拉起传输完成
    this.kvUsed = 0;
    this.draining = false;
    this.link = new TransferLink();
  }
  maxTokens(P){ return Math.max(1, Math.floor(P.kvGbP * 2**30 / cellSizeOf(P))); }
  pendingLoad(){
    let s = 0;
    for (const r of this.routingQ) s += r.uncachedLen;
    for (const r of this.waitingQ) s += r.uncachedLen;
    for (const slot of this.slots) s += slot.req.uncachedLen;
    return s;
  }
  isEmpty(){
    return this.slots.length === 0 && !this.link.current && this.routingQ.length === 0 &&
           this.waitingQ.length === 0 && this.inflight.length === 0 && this.link.queue.length === 0;
  }
}

class DecodeNode {             // D 节点: 接收 KV 拉起 + continuous batching decode
  constructor(id){
    this.id = id;
    this.preallocQ = [];       // 路由握手 + KV 预分配 (等 P 的 KV 到位)
    this.readQ = [];           // KV Store 读取: 命中部分 KV 从缓存存储拉取(与 miss 传输并行)
    this.readCurrent = null;   // { req, doneAt } 正在读取的请求
    this.transferQ = [];       // 等缓存拉起传输完成
    this.waitingQ = [];        // 调度器 waiting_queue
    this.running = [];         // continuous batch
    this.kvUsed = 0;
    this.nextStepAt = null;
    this.draining = false;
    this.ntr = 0;              // new_token_ratio (admission reserve); init in resetNtr
    this.retractGlow = -1e9;
  }
  maxTokens(P){ return Math.max(1, Math.floor(P.kvGbD * 2**30 / cellSizeOf(P))); }
  /* 一次 decode 前向步受显存带宽限制: 流式读取激活权重(decodeMsBase) + 每个
     running 请求的 KV cache。KV 随上下文长度增长, 故长上下文批次步速更慢。 */
  decodeStepMs(P){
    const perTokMs = P.decodeMsPerReq / PERREQ_REF_CTX;
    let kvMs = 0;
    for (const r of this.running) kvMs += perTokMs * (r.inputLen + r.tokensOut);
    return P.decodeMsBase + kvMs;
  }
  pendingLoad(){
    return this.preallocQ.length + this.readQ.length + (this.readCurrent ? 1 : 0) +
           this.transferQ.length + this.waitingQ.length + this.running.length;
  }
  isEmpty(){
    return this.preallocQ.length === 0 && this.readQ.length === 0 && !this.readCurrent &&
           this.transferQ.length === 0 && this.waitingQ.length === 0 && this.running.length === 0;
  }
  reservedOffset(){
    let off = 0;
    for (const r of this.running)
      off += Math.min(r.outputLen - r.tokensOut, NTR_CLIP) * this.ntr;
    return off;
  }
  raiseNtrAfterRetract(){
    let decoded = 0, projected = 0;
    for (const r of this.running){
      decoded += r.tokensOut;
      projected += Math.min(r.outputLen, NTR_CLIP);
    }
    const frac = projected > 0 ? decoded / projected : 0;
    this.ntr = clamp(Math.max(this.ntr, 1 - frac), this.ntr, NTR_MAX);
  }
  /* vLLM preemption 模拟: 下一步新 token 放不下时, 抢占已 decode 最少的请求,
     释放其 KV(保留已生成 token, 重新 prefill), 推回 waiting 队首。 */
  retractDecode(P, engine, now){
    const cap = this.maxTokens(P);
    let count = 0;
    while (this.running.length > 1 && this.kvUsed + this.running.length > cap){
      let vi = 0;
      for (let i = 1; i < this.running.length; i++){
        const a = this.running[i], b = this.running[vi];
        if (a.tokensOut < b.tokensOut ||
            (a.tokensOut === b.tokensOut && a.inputLen > b.inputLen)) vi = i;
      }
      const victim = this.running[vi];
      this.kvUsed -= (victim.inputLen + victim.tokensOut);
      this.running.splice(vi, 1);
      victim.retracted = true;
      victim.stage = "d_waiting";
      this.waitingQ.unshift(victim);
      count++;
    }
    if (count){ this.raiseNtrAfterRetract(); this.retractGlow = now; engine.retractTotal += count; }
    return count;
  }
}

/* 路由策略 — Router 将请求分发给 P/D 节点池(pool 已过滤 draining),
   loadOf(inst) 为负载度量, rr 为轮询计数对象。 */
function selectByPolicy(policy, pool, loadOf, rng, rr){
  if (pool.length === 1) return pool[0];
  switch (policy){
    case "round_robin":
      return pool[rr.i++ % pool.length];
    case "random":
      return pool[Math.floor(rng() * pool.length)];
    case "power_of_two": {
      const a = pool[Math.floor(rng() * pool.length)];
      let b = pool[Math.floor(rng() * pool.length)];
      if (b === a) b = pool[(pool.indexOf(a) + 1) % pool.length];
      return loadOf(a) <= loadOf(b) ? a : b;
    }
    case "least":
    default: {
      let best = pool[0], bl = loadOf(best);
      for (let i = 1; i < pool.length; i++){
        const l = loadOf(pool[i]);
        if (l < bl){ bl = l; best = pool[i]; }
      }
      return best;
    }
  }
}

/* ========================= MetricsCollector ========================== */
const SERIES_KEYS = ["ttft","tpot","e2e","rps","tps","pQueue","dQueue","running",
                     "kvP","kvD","kvDpre","dPull","link","inflight","dHandshake","kvRead"];
const BD_KEYS = ["tokenize","routing","pQueue","prefill","kvPull","dQueue","detok"];

class MetricsCollector {
  constructor(){ this.reset(0); }
  reset(now){
    this.ring = new Array(RING_MAX); this.ringN = 0; this.ringIdx = 0;
    this.series = {};
    for (const k of SERIES_KEYS){
      this.series[k] = new Float64Array(SERIES_LEN).fill(NaN);
    }
    this.seriesHead = 0; this.seriesCount = 0;
    this.bucketStart = now;
    this.bkComp = 0; this.bkTokens = 0; this.bkTtftSum = 0; this.bkTpotSum = 0;
    this.bkE2eSum = 0; this.bkDhsSum = 0;
    this.bkBd = new Array(BD_KEYS.length).fill(0);
    this.bdSeries = [];
    for (let j = 0; j < BD_KEYS.length; j++)
      this.bdSeries.push(new Float64Array(SERIES_LEN).fill(NaN));
    this.totalCompleted = 0; this.totalTokens = 0;
    this.bkCompBd = 0;               // 计入 breakdown 均值(排除被抢占的无效段)的请求数
  }
  record(r, now){
    const s = r.stamps;
    const ttft = s.firstToken - s.recv;
    const tpot = r.outputLen > 1 ? (s.lastToken - s.firstToken) / (r.outputLen - 1) : 0;
    const e2e = s.detokDone - s.recv;
    this.bkE2eSum = (this.bkE2eSum || 0) + e2e;
    const bd = [
      s.tokenized - s.recv,               // 请求进入 + tokenize
      s.routingDone - s.tokenized,        // 路由分发 + D 预分配握手
      s.pQueueExit - s.routingDone,       // P 排队
      s.prefillDone - s.pQueueExit,       // P prefill 计算
      s.transferDone - s.prefillDone,     // D 缓存拉起(KV 传输)
      s.dQueueExit - s.transferDone,      // D 排队
      s.firstToken - s.dQueueExit,        // detok → 首 token
    ];
    const dHandshake = s.preallocDone - s.tokenized;
    this.ring[this.ringIdx] = { ttft, tpot, e2e, bd, dHandshake, t: now };
    this.ringIdx = (this.ringIdx + 1) % RING_MAX;
    if (this.ringN < RING_MAX) this.ringN++;
    this.bkComp++; this.bkTokens += r.outputLen;
    this.bkTtftSum += ttft; this.bkTpotSum += tpot;
    this.bkDhsSum = (this.bkDhsSum || 0) + dHandshake;
    /* 被抢占请求的首 token 早于最终入批时刻, 其 bd 分解不再是线性流水,
       仅对 bd 均值生效(ttft/tpot/e2e 仍有效) */
    const bdOk = !r.retracted && bd.every(v => v >= -0.001);
    if (bdOk){
      for (let j = 0; j < BD_KEYS.length; j++) this.bkBd[j] += bd[j];
      this.bkCompBd++;
    }
    this.totalCompleted++; this.totalTokens += r.outputLen;
  }
  tick(now, engine){
    while (now - this.bucketStart >= BUCKET_MS){
      this.bucketStart += BUCKET_MS;
      const g = engine.sampleGauges();
      const put = (k, v) => { this.series[k][this.seriesHead] = v; };
      put("ttft", this.bkComp ? this.bkTtftSum / this.bkComp : NaN);
      put("tpot", this.bkComp ? this.bkTpotSum / this.bkComp : NaN);
      put("e2e", this.bkComp ? this.bkE2eSum / this.bkComp : NaN);
      put("rps", this.bkComp * 1000 / BUCKET_MS);
      put("tps", this.bkTokens * 1000 / BUCKET_MS);
      put("pQueue", g.pQueue); put("dQueue", g.dQueue); put("running", g.running);
      put("kvP", g.kvP); put("kvD", g.kvD); put("kvDpre", g.kvDpre); put("link", g.link);
      put("dPull", g.dPull); put("kvRead", g.kvRead);
      put("dHandshake", this.bkComp ? this.bkDhsSum / this.bkComp : NaN);
      put("inflight", g.inflight);
      for (let j = 0; j < BD_KEYS.length; j++)
        this.bdSeries[j][this.seriesHead] = this.bkCompBd ? this.bkBd[j] / this.bkCompBd : NaN;
      this.seriesHead = (this.seriesHead + 1) % SERIES_LEN;
      if (this.seriesCount < SERIES_LEN) this.seriesCount++;
      this.bkComp = 0; this.bkTokens = 0; this.bkTtftSum = 0; this.bkTpotSum = 0;
      this.bkE2eSum = 0; this.bkDhsSum = 0;
      this.bkBd.fill(0); this.bkCompBd = 0;
    }
  }
  snapshot(now, windowMs){
    const total = this.ringN;
    if (total === 0) return null;
    const cutoff = (windowMs != null && now != null) ? now - windowMs : -Infinity;
    const ttftA = [], tpotA = [], e2eA = [], dhsA = [];
    const bdSum = new Array(BD_KEYS.length).fill(0);
    let bdN = 0;
    for (let i = 0; i < total; i++){
      const e = this.ring[i];
      if (e.t != null && e.t < cutoff) continue;
      ttftA.push(e.ttft); tpotA.push(e.tpot); e2eA.push(e.e2e);
      dhsA.push(e.dHandshake || 0);
      const bdOk = e.bd.every(v => v >= -0.001);
      if (bdOk){ for (let j = 0; j < BD_KEYS.length; j++) bdSum[j] += e.bd[j]; bdN++; }
    }
    const n = ttftA.length;
    if (n === 0) return null;
    const ttfts = Float64Array.from(ttftA), tpots = Float64Array.from(tpotA);
    const e2es = Float64Array.from(e2eA), dhss = Float64Array.from(dhsA);
    ttfts.sort(); tpots.sort(); e2es.sort(); dhss.sort();
    const pct = (arr, p) => arr[Math.min(n - 1, Math.floor(p * n))];
    const avg = arr => { let s = 0; for (const v of arr) s += v; return s / n; };
    return {
      n,
      ttft: { avg: avg(ttfts), p50: pct(ttfts, .5), p99: pct(ttfts, .99) },
      tpot: { avg: avg(tpots), p50: pct(tpots, .5), p99: pct(tpots, .99) },
      e2e:  { avg: avg(e2es),  p50: pct(e2es, .5),  p99: pct(e2es, .99) },
      dHandshake: { avg: avg(dhss), p99: pct(dhss, .99) },
      bd: bdSum.map(v => v / (bdN || 1)),
    };
  }
  latestSeries(k){
    const out = [];
    const start = (this.seriesHead - this.seriesCount + SERIES_LEN) % SERIES_LEN;
    for (let i = 0; i < this.seriesCount; i++)
      out.push(this.series[k][(start + i) % SERIES_LEN]);
    return out;
  }
  recentBreakdown(lastN){
    const out = new Array(BD_KEYS.length).fill(0);
    let any = false;
    for (let j = 0; j < BD_KEYS.length; j++){
      let sum = 0, cnt = 0;
      for (let back = 1; back <= Math.min(lastN, this.seriesCount); back++){
        const v = this.bdSeries[j][(this.seriesHead - back + SERIES_LEN) % SERIES_LEN];
        if (!Number.isNaN(v)){ sum += v; cnt++; }
      }
      if (cnt){ out[j] = sum / cnt; any = true; }
    }
    if (any) return out;
    const s = this.snapshot();
    return s ? s.bd : out;
  }
}

/* ============================ SimEngine ============================== */
class SimEngine {
  constructor(P, seed = 12345){
    this.P = P;
    this.rng = mulberry32(seed);
    this.metrics = new MetricsCollector();
    this.reset();
  }
  reset(){
    this.now = 0;
    this.pList = []; this.dList = [];
    this.pSeq = 0; this.dSeq = 0;
    this.responding = [];      // detok → client
    this.allActive = new Set();
    this.rrP = { i: 0 }; this.rrD = { i: 0 };
    this.nextArrival = this.P.arrivalDist === "uniform"
      ? 1000 / Math.max(0.01, this.P.qps)
      : expSample(this.rng, 1000 / Math.max(0.01, this.P.qps));
    this.linkBusyMs = 0;
    this.lastGaugeAt = 0;
    this.inflightIntegral = 0;
    this.debugMaxKvRatio = 0;
    this.tokenConservationOk = true;
    this.retractTotal = 0;
    this.metrics.reset(0);
    this.syncTopology();
  }
  syncTopology(){
    const P = this.P;
    while (this.pList.length < P.numP) this.pList.push(new PrefillNode(this.pSeq++));
    while (this.dList.length < P.numD) this.dList.push(new DecodeNode(this.dSeq++));
    for (let i = 0; i < this.pList.length; i++) this.pList[i].draining = i >= P.numP;
    for (let i = 0; i < this.dList.length; i++) this.dList[i].draining = i >= P.numD;
    while (this.pList.length > P.numP && this.pList[this.pList.length - 1].isEmpty())
      this.pList.pop();
    while (this.dList.length > P.numD && this.dList[this.dList.length - 1].isEmpty())
      this.dList.pop();
  }
  advance(dtSim){
    const target = this.now + dtSim;
    while (this.now < target){
      this.now = Math.min(target, this.now + TICK);
      this.step();
    }
  }
  step(){
    const P = this.P, now = this.now;
    this.syncTopology();

    /* -- 请求进入 → Router 双路分发到 P 和 D (vLLM 的 PD 分离调度:
          请求同时派发给 P(算 KV) 与 D(预留 KV 块), 各自跑 TokenizerManager) -- */
    while (this.nextArrival <= now){
      const r = makeRequest(this, this.nextArrival);
      this.allActive.add(r);
      const activeP = this.pList.filter(p => !p.draining);
      const activeD = this.dList.filter(d => !d.draining);
      const best = selectByPolicy(P.lbPolicyP, activeP, p => p.pendingLoad(), this.rng, this.rrP);
      const d = selectByPolicy(P.lbPolicyD, activeD, x => x.pendingLoad(), this.rng, this.rrD);
      r.p = best; r.d = d;
      const tokMs = r.inputLen * P.tokenizeUsPerTok / 1000;
      r.stamps.tokenized = this.nextArrival + tokMs;
      r.stage = "routing"; r.kvPoll = KVPOLL.Bootstrapping;
      /* P 与 D 都需要 tokenized 输入 + 一个路由 RTT 才能动作; P 的放行额外
         依赖 D 预分配完成(见下) — 缓存拉起等待由此涌现, 而非固定延迟 */
      r.readyAt = r.stamps.tokenized + ROUTE_RTT_MS;
      r.dReadyAt = r.stamps.tokenized + ROUTE_RTT_MS;
      best.routingQ.push(r);
      d.preallocQ.push(r);
      this.nextArrival += P.arrivalDist === "uniform"
        ? 1000 / Math.max(0.01, P.qps)
        : expSample(this.rng, 1000 / Math.max(0.01, P.qps));
    }

    /* -- P 节点: chunked prefill 计算 KV, 经 KV Connector 拉起 -- */
    for (const p of this.pList){
      /* 路由握手完成: P 侧在 (a) 自身 RTT 走完 且 (b) 配对的 D 已预分配并
         就绪(r.dPrealloc) 后放行进入 waiting。D 的 KV 池打满时请求在此堆积,
         握手等待随 D KV 压力自然增长。 */
      const ready = p.routingQ.filter(r => r.readyAt <= now && r.dPrealloc);
      if (ready.length){
        const rdy = new Set(ready);
        for (const r of ready){
          r.stamps.routingDone = now;
          r.stage = "p_waiting"; r.kvPoll = KVPOLL.WaitingForInput;
          p.waitingQ.push(r);
        }
        p.routingQ = p.routingQ.filter(r => !rdy.has(r));
      }
      /* waiting 队首进空闲 slot(仅 miss 部分参与计算) */
      while (p.slots.length < 1 && p.waitingQ.length){
        const r = p.waitingQ[0];
        const cap = p.maxTokens(P);
        if (p.kvUsed + r.inputLen > cap) break;
        p.waitingQ.shift();
        p.kvUsed += r.inputLen;
        this.debugMaxKvRatio = Math.max(this.debugMaxKvRatio, p.kvUsed / cap);
        r.stamps.pQueueExit = now;
        r.stage = "p_prefill";
        r.chunksTotal = Math.max(1, Math.ceil(r.uncachedLen / P.chunkSize));
        r.bytesTotal = r.uncachedLen * cellSizeOf(P);
        p.slots.push({ req: r, busyUntil: now + chunkPrefillMs(P, r, 0) });
      }
      /* 分块完成(一个 tick 内可能多个) */
      for (let si = p.slots.length - 1; si >= 0; si--){
        const slot = p.slots[si];
        while (slot.busyUntil <= now){
          const r = slot.req;
          r.chunksComputed++;
          this.enqueueReadyChunks(p, r);   // 每算完一块即入拉起队列
          if (r.chunksComputed >= r.chunksTotal){
            r.stamps.prefillDone = slot.busyUntil;
            r.stage = "kv_pull"; r.kvPoll = KVPOLL.Transferring;
            p.inflight.push(r);
            p.slots.splice(si, 1);
            break;
          } else {
            slot.busyUntil += chunkPrefillMs(P, r, r.chunksComputed);
          }
        }
      }
      /* KV Connector 链路推进(缓存拉起传输) */
      const link = p.link;
      for (;;){
        if (link.current && link.doneAt <= now){
          const it = link.current;
          it.req.chunksTransferred++;
          it.req.bytesDone += it.bytes;
          link.current = null;
          if (it.req.chunksTransferred >= it.req.chunksTotal && it.req.stage === "kv_pull")
            this.completeTransfer(p, it.req, it.doneAtWas);
        }
        if (!link.current && link.queue.length){
          const it = link.queue.shift();
          /* 固定开销 = 缓存拉起 overhead(cacheReadMs); 带宽按 GiB/s(2**30),
             与 KV-GB → tokens 的换算一致 */
          const dur = P.cacheReadMs + it.bytes / (P.bandwidthGBs * 2**30) * 1000;
          link.current = it;
          link.startAt = Math.max(now - TICK, link.doneAt); // back-to-back on same tick
          link.doneAt = link.startAt + dur;
          it.doneAtWas = link.doneAt;
          continue;
        }
        break;
      }
      if (link.current) this.linkBusyMs += TICK;
    }

    /* -- D 节点: KV 预分配 + 缓存拉起完成 → continuous batching decode -- */
    for (const d of this.dList){
      /* DecodePreallocQueue: tokenize+路由完成 + KV 有空闲。SGLang/vLLM admission:
         候选请求 input + 预计新 token ≤ 池容量 − 在飞 decode 预留(reservedOffset)。
         此处只实际预留 prefill KV(inputLen); decode KV 每步 +1。容量不足则 FIFO
         阻塞; 未完成握手跳过(poll 语义)。 */
      if (d.preallocQ.length && d.preallocQ.some(r => r.dReadyAt <= now)){
        const still = [];
        let blocked = false;
        const cap = d.maxTokens(P);
        for (const r of d.preallocQ){
          if (blocked || r.dReadyAt > now){ still.push(r); continue; }
          const projNew = Math.min(r.outputLen, NTR_CLIP);
          const need = r.inputLen + projNew;
          const rem = cap - d.kvUsed - d.reservedOffset();
          if (need > rem){ still.push(r); blocked = true; continue; }
          d.kvUsed += r.inputLen;
          this.debugMaxKvRatio = Math.max(this.debugMaxKvRatio, d.kvUsed / cap);
          r.dPrealloc = true;
          r.stamps.preallocDone = now;
          d.transferQ.push(r);
          /* 命中部分 KV 走 KV Store 读取通道(与 P 的 miss 传输并行); 全 miss 则立即置完成 */
          if (r.cachedLen > 0) d.readQ.push(r); else r.hitDone = true;
          this.enqueueReadyChunks(r.p, r);   // flush prealloc 前已算好的块
        }
        d.preallocQ.length = 0;
        for (const r of still) d.preallocQ.push(r);
      }
      /* KV Store 读取: 命中部分 KV 从缓存存储拉到 D(每节点一条串行读取通道),
         固定开销 cacheReadMs + 命中字节数/kvReadGBs, 与 miss 传输并行推进。 */
      if (!d.readCurrent && d.readQ.length){
        const r = d.readQ.shift();
        const dur = P.cacheReadMs + r.hitBytes / (P.kvReadGBs * 2**30) * 1000;
        d.readCurrent = { req: r, doneAt: now + dur };
      }
      if (d.readCurrent && d.readCurrent.doneAt <= now){
        const it = d.readCurrent;
        it.req.hitDone = true;
        it.req.stamps.hitReadDone = it.doneAt;
        d.readCurrent = null;
        this.maybeEnterDWaiting(it.req);
      }
      /* DecodeTransferQueue 在 completeTransfer()/maybeEnterDWaiting() 中清空 */
      /* waiting → running。continuous batching 只在调度步边界合并新请求:
         步内到达的请求须等当前前向步结束(nextStepAt)才能加入并提交首 token。 */
      if (d.ntr < P.newTokenRatio) d.ntr = P.newTokenRatio;
      const admit = (at) => {
        const cap = d.maxTokens(P);
        while (d.waitingQ.length && d.running.length < P.maxRunning){
          const r = d.waitingQ[0];
          const joinKv = r.retracted ? (r.inputLen + r.tokensOut) : 1;
          if (d.kvUsed + joinKv + (d.running.length + 1) > cap) break;
          d.waitingQ.shift();
          d.kvUsed += joinKv;
          this.debugMaxKvRatio = Math.max(this.debugMaxKvRatio, d.kvUsed / cap);
          r.stamps.dQueueExit = at;
          r.stage = "d_running";
          if (!r.retracted){
            r.tokensOut = 1;
            r.stamps.firstToken = at + P.detokenizeMs;
            this.metrics.bkTokens++; this.metrics.totalTokens++;
          } else {
            r.retracted = false;
          }
          r.lastTokenT = at;
          d.running.push(r);
        }
      };
      if (d.running.length === 0 && d.waitingQ.length){
        admit(now);
        d.nextStepAt = now + d.decodeStepMs(P);
      }
      if (d.running.length === 0){
        d.nextStepAt = null;
        if (d.isEmpty()) d.ntr = P.newTokenRatio;
        continue;
      }
      while (d.nextStepAt !== null && d.nextStepAt <= now){
        const stepAt = d.nextStepAt;
        const cap = d.maxTokens(P);
        const retracted = d.retractDecode(P, this, stepAt);
        if (d.running.length === 0){ d.nextStepAt = null; break; }
        for (let i = d.running.length - 1; i >= 0; i--){
          const r = d.running[i];
          r.tokensOut++;
          d.kvUsed += 1;
          r.lastTokenT = stepAt;
          this.metrics.bkTokens++; this.metrics.totalTokens++;
          if (r.tokensOut >= r.outputLen){
            r.stamps.lastToken = stepAt + P.detokenizeMs;
            d.running.splice(i, 1);
            d.kvUsed -= (r.inputLen + r.tokensOut);
            if (r.tokensOut !== r.outputLen) this.tokenConservationOk = false;
            r.stage = "response"; r.readyAt = stepAt + P.detokenizeMs;
            this.responding.push(r);
          }
        }
        this.debugMaxKvRatio = Math.max(this.debugMaxKvRatio, d.kvUsed / cap);
        if (!retracted)
          d.ntr = Math.max(P.newTokenRatio, d.ntr - (NTR_MAX - P.newTokenRatio) / NTR_DECAY_STEPS);
        admit(stepAt);
        if (d.running.length === 0){ d.nextStepAt = null; break; }
        d.nextStepAt = stepAt + d.decodeStepMs(P);
      }
    }

    /* -- D detok → client: 完成 -- */
    for (let i = this.responding.length - 1; i >= 0; i--){
      const r = this.responding[i];
      if (r.readyAt > now) continue;
      this.responding.splice(i, 1);
      r.stamps.detokDone = r.readyAt;
      r.stage = "done";
      this.allActive.delete(r);
      this.metrics.record(r, now);
    }

    this.inflightIntegral += this.allActive.size * TICK;
    this.metrics.tick(now, this);
  }

  /* prealloc 完成后把已算好未发送的块入拉起队列(sender 等 D 的 page 索引) */
  enqueueReadyChunks(p, r){
    if (!r.dPrealloc || !p) return;
    while (r.chunksQueued < r.chunksComputed){
      const toks = chunkTokens(this, r, r.chunksQueued);
      p.link.queue.push({ req: r, bytes: toks * cellSizeOf(this.P), tokens: toks });
      r.chunksQueued++;
    }
  }
  completeTransfer(p, r, doneAt){
    /* miss 部分传输完成: P 释放 KV, 标记 missDone; 命中部分可能仍在 Store 读取中 */
    p.kvUsed -= r.inputLen;
    const ii = p.inflight.indexOf(r);
    if (ii >= 0) p.inflight.splice(ii, 1);
    r.missDone = true;
    r.stamps.missTransferDone = doneAt;
    this.maybeEnterDWaiting(r);
  }
  /* KVPoll.Success 汇聚门: miss 传输与 hit 读取全部到位 → D 请求进入 waiting。
     transferDone 取两者较晚者(即缓存拉起的真实完成时刻); 全 miss 请求无读取段。 */
  maybeEnterDWaiting(r){
    if (!r.missDone || !r.hitDone) return;
    const missT = Number.isFinite(r.stamps.missTransferDone) ? r.stamps.missTransferDone : 0;
    const hitT = Number.isFinite(r.stamps.hitReadDone) ? r.stamps.hitReadDone : 0;
    r.stamps.transferDone = Math.max(missT, hitT);
    r.kvPoll = KVPOLL.Success;
    r.stage = "d_waiting";
    const d = r.d;
    const ti = d.transferQ.indexOf(r);
    if (ti >= 0) d.transferQ.splice(ti, 1);
    d.waitingQ.push(r);
  }

  sampleGauges(){
    let pQueue = 0, dQueue = 0, running = 0, kvPu = 0, kvPc = 0, kvDu = 0, kvDc = 0;
    let kvDpre = 0, dPull = 0, kvRead = 0;
    for (const p of this.pList){
      pQueue += p.routingQ.length + p.waitingQ.length;
      kvPu += p.kvUsed; kvPc += p.maxTokens(this.P);
    }
    for (const d of this.dList){
      dQueue += d.preallocQ.length + d.transferQ.length + d.waitingQ.length;
      running += d.running.length;
      kvDu += d.kvUsed; kvDc += d.maxTokens(this.P);
      dPull += d.transferQ.length;
      kvRead += d.readQ.length + (d.readCurrent ? 1 : 0);
      for (const r of d.transferQ) kvDpre += r.inputLen;
      for (const r of d.waitingQ)  kvDpre += r.retracted ? 0 : r.inputLen;
    }
    const dtMs = Math.max(1, this.now - this.lastGaugeAt);
    const link = this.linkBusyMs / (dtMs * Math.max(1, this.pList.length));
    this.linkBusyMs = 0; this.lastGaugeAt = this.now;
    return {
      pQueue, dQueue, running,
      kvP: kvPc ? kvPu / kvPc : 0, kvD: kvDc ? kvDu / kvDc : 0,
      kvDpre: kvDc ? kvDpre / kvDc : 0,
      link: clamp(link, 0, 1),
      dPull, kvRead,
      inflight: this.allActive.size,
    };
  }
}

/* ====================== Headless self-test =========================== */
function runHeadless(overrides, seconds, seed = 42){
  const p = Object.assign({}, DEFAULTS, overrides);
  const eng = new SimEngine(p, seed);
  for (let ts = 0; ts < seconds * 1000; ts += 1000) eng.advance(1000);
  return eng;
}
function runSelfTest(log = console.log){
  const results = [];
  const check = (name, cond, detail) => {
    results.push([name, !!cond, detail]);
    log((cond ? "PASS " : "FAIL ") + name + (detail ? "  [" + detail + "]" : ""));
  };
  const base = { inputDist:"fixed", outputDist:"fixed", cacheHitRate:0,
                 inputLenMean:2048, outputLenMean:128,
                 prefillTokPerSec:20000,
                 decodeMsBase:20, decodeMsPerReq:0.15 };

  /* 1. low load: TPOT ≈ decode step base */
  {
    const e = runHeadless({...base, qps:0.5}, 90);
    const s = e.metrics.snapshot();
    check("tpot≈decodeStep@lowLoad",
      s && Math.abs(s.tpot.avg - (DEFAULTS.decodeMsBase + DEFAULTS.decodeMsPerReq)) <
           DEFAULTS.decodeMsBase * 0.3,
      s ? "tpot=" + s.tpot.avg.toFixed(2) + "ms" : "no data");
  }
  /* 2. Little's law: avg in-flight ≈ arrival rate × avg E2E */
  {
    const e = runHeadless({...base, qps:8}, 240);
    const s = e.metrics.snapshot();
    const avgInflight = e.inflightIntegral / e.now;
    const expect = 8 * s.e2e.avg / 1000;
    check("littlesLaw", Math.abs(avgInflight - expect) / expect < 0.30,
      "L=" + avgInflight.toFixed(1) + " λW=" + expect.toFixed(1));
  }
  /* 3. cache hit → prefill + KV-pull components collapse (vLLM APC 收益) */
  {
    const a = runHeadless({...base, qps:1, cacheHitRate:0}, 90).metrics.snapshot();
    const b = runHeadless({...base, qps:1, cacheHitRate:0.99}, 90).metrics.snapshot();
    const drop = (a.bd[3] + a.bd[4]) > 0 ? 1 - (b.bd[3] + b.bd[4]) / (a.bd[3] + a.bd[4]) : 0;
    check("cacheHit→prefill+pull↓", drop > 0.8, "drop=" + (drop * 100).toFixed(0) + "%");
  }
  /* 4. token conservation + KV capacity never exceeded */
  {
    const e = runHeadless({...base, qps:16, kvGbP:2, kvGbD:2}, 120);
    check("tokenConservation", e.tokenConservationOk, "");
    check("kvNeverExceeded", e.debugMaxKvRatio <= 1.0001,
      "maxRatio=" + e.debugMaxKvRatio.toFixed(4));
  }
  /* 5. 更小 chunk 重叠计算与拉起 → TTFT 更低 */
  {
    const cfg = {...base, qps:0.5, inputLenMean:16384, bandwidthGBs:2, cacheReadMs:0};
    const small = runHeadless({...cfg, chunkSize:1024}, 90).metrics.snapshot().ttft.avg;
    const big = runHeadless({...cfg, chunkSize:32768}, 90).metrics.snapshot().ttft.avg;
    check("chunkOverlapHelpsTTFT", small <= big * 1.02,
      "small=" + small.toFixed(0) + " big=" + big.toFixed(0));
  }
  /* 6. 路由等待被 D 预分配 gating: 紧 D KV 池让 routing 段增长(涌现, 非滑块) */
  {
    const cfg = {...base, qps:6, inputLenMean:8192, outputLenMean:512, numP:2, numD:1};
    const roomy = runHeadless({...cfg, kvGbD:99}, 90).metrics.snapshot();
    const tight = runHeadless({...cfg, kvGbD:1}, 90).metrics.snapshot();
    check("routingGatedByD_KV", tight.bd[1] > roomy.bd[1] * 3 + 5,
      "roomy=" + roomy.bd[1].toFixed(1) + "ms tight=" + tight.bd[1].toFixed(1) + "ms");
  }
  /* 7. KV Store 读取: 命中 KV 从 Store 按带宽拉取, 带宽受限时 kvPull(bd[4]) 段增长 */
  {
    const cfg = {...base, cacheHitRate:0.9, inputLenMean:8192, outputLenMean:64,
                 kvGbD:99, bandwidthGBs:80, qps:1};
    const slow = runHeadless({...cfg, kvReadGBs:2}, 90).metrics.snapshot();
    const fast = runHeadless({...cfg, kvReadGBs:200}, 90).metrics.snapshot();
    check("kvReadBandwidthGatesPull", slow.bd[4] > fast.bd[4] * 3 + 5,
      "slow=" + slow.bd[4].toFixed(1) + "ms fast=" + fast.bd[4].toFixed(1) + "ms");
  }
  /* 8. 全 miss 请求(命中率0) 读取字节为0 → kvPull 只含传输, 且不应被 kvReadGBs 卡住 */
  {
    const cfg = {...base, cacheHitRate:0, inputLenMean:4096, outputLenMean:64,
                 kvGbD:99, bandwidthGBs:80, qps:1};
    const a = runHeadless({...cfg, kvReadGBs:1}, 90).metrics.snapshot();
    const b = runHeadless({...cfg, kvReadGBs:200}, 90).metrics.snapshot();
    check("missRequestsIgnoreReadBw", Math.abs(a.bd[4] - b.bd[4]) < a.bd[4] * 0.5,
      "a=" + a.bd[4].toFixed(1) + "ms b=" + b.bd[4].toFixed(1) + "ms");
  }
  const failed = results.filter(r => !r[1]).length;
  log(failed === 0 ? "ALL " + results.length + " CHECKS PASSED"
                   : failed + "/" + results.length + " CHECKS FAILED");
  return failed === 0;
}
/*ENGINE-END*/

/* ========================== Renderer ================================= */
const COLORS = {
  Bootstrapping:"#f0b429", WaitingForInput:"#7d8590", Transferring:"#4ea1ff",
  Success:"#3fb950", decoding:"#bc8cff", tokenize:"#39c5cf", retract:"#f85149",
  bd:["#39c5cf","#f0b429","#7d8590","#f0883e","#4ea1ff","#bc8cff","#3fb950"],
};
function kvGaugeColor(r){ return r < 0.7 ? "#3fb950" : (r < 0.9 ? "#f0b429" : "#f85149"); }
const BOX_H = 118, BOX_GAP = 12;
const CLIENT_VIS_MS = 60;          // cosmetic client→router inbound-hop travel time
const FANOUT_VIS_MS = 60;          // cosmetic router→P/D concurrent-dispatch travel time

class Renderer {
  constructor(cv){ this.cv = cv; this.ctx = cv.getContext("2d"); this.W = 0; this.H = 0; }
  resize(sim){
    const w = this.cv.parentElement.clientWidth || 800;
    const n = Math.max(sim.pList.length, sim.dList.length);
    const h = Math.max(420, n * (BOX_H + BOX_GAP) - BOX_GAP + 70);
    const dpr = window.devicePixelRatio || 1;
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (this.cv.width !== pw || this.cv.height !== ph){
      this.cv.width = pw; this.cv.height = ph;
      this.cv.style.height = h + "px";
    }
    this.W = w; this.H = h; this.dpr = dpr;
  }

  draw(sim){
    const ctx = this.ctx, W = this.W, H = this.H, now = sim.now;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = "10px sans-serif";
    const midY = H / 2;

    /* ---- node rects: client → router → {P col, D col} → back to client ---- */
    const nodeH = 46;
    const nd = (fx, fw, name) => ({ x: fx * W, y: midY - nodeH / 2, w: fw * W, h: nodeH, name });
    const client = nd(.015, .065, t("n.client"));
    const router = nd(.125, .075, t("n.router"));
    const areaT = 30, areaB = H - 40;
    const boxW = Math.max(W * .21, 150);
    const boxCol = (bx, list) => {
      const n = list.length;
      const totH = n * BOX_H + (n - 1) * BOX_GAP;
      const y0 = areaT + Math.max(0, (areaB - areaT - totH) / 2);
      return list.map((_, i) => ({ x: bx, y: y0 + i * (BOX_H + BOX_GAP), w: boxW, h: BOX_H }));
    };
    const pX = W * .27;
    const dX = Math.min(Math.max(W * .68, pX + boxW + 40), W - 16 - boxW);
    const pRects = boxCol(pX, sim.pList);
    const dRects = boxCol(dX, sim.dList);

    /* ---- edges (under everything) ---- */
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#2d3646";
    ctx.beginPath(); ctx.moveTo(client.x + client.w, midY); ctx.lineTo(router.x, midY); ctx.stroke();
    const curve = (x1, y1, x2, y2, style, width) => {
      ctx.strokeStyle = style || "#2d3646"; ctx.lineWidth = width || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2;
      ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
      ctx.stroke();
    };
    /* router 双路下发: 红 → P, 蓝 → D */
    ctx.globalAlpha = 0.7;
    for (const pr of pRects)
      curve(router.x + router.w, midY, pr.x, pr.y + pr.h / 2, "#f85149", 1.3);
    for (const dr of dRects)
      curve(router.x + router.w, midY, dr.x, dr.y + dr.h / 2, "#4ea1ff", 1.3);
    ctx.globalAlpha = 1;
    /* P→D: KV cache 拉起通道 — 蓝色通道 + 方向箭头, 明确"D 从 P 获取 KV cache" */
    const bezPt = (x1, y1, x2, y2, mx, tt) => {
      const u = 1 - tt;
      return { x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2,
               y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2 };
    };
    for (const pr of pRects) for (const dr of dRects){
      const x1 = pr.x + pr.w, y1 = pr.y + pr.h / 2, x2 = dr.x, y2 = dr.y + dr.h / 2;
      curve(x1, y1, x2, y2, "rgba(78,161,255,0.32)", 1.3);
      const mx = (x1 + x2) / 2;
      const a = bezPt(x1, y1, x2, y2, mx, 0.49), b = bezPt(x1, y1, x2, y2, mx, 0.51);
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const m = bezPt(x1, y1, x2, y2, mx, 0.5);
      ctx.save();
      ctx.translate(m.x, m.y); ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(7, 0); ctx.lineTo(-5, 4.5); ctx.lineTo(-5, -4.5); ctx.closePath();
      ctx.fillStyle = "#4ea1ff"; ctx.globalAlpha = 0.75; ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
    /* 虚线响应回流: D 底部 ↓ 到 router 下方 → 再 ↓ 到 client */
    const boxBottom = Math.max(
      pRects.length ? pRects[pRects.length - 1].y + BOX_H : midY,
      dRects.length ? dRects[dRects.length - 1].y + BOX_H : midY);
    const respY = Math.min(H - 10, boxBottom + 40);
    const routerCx = router.x + router.w / 2;
    const respPath = dr => [
      { x: dr.x + dr.w / 2, y: dr.y + dr.h },
      { x: dr.x + dr.w / 2, y: respY },
      { x: routerCx, y: respY },
      { x: routerCx, y: router.y + router.h },
    ];
    ctx.strokeStyle = "#3d4a5e"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const dr of dRects){
      const pts = respPath(dr);
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    }
    ctx.stroke();
    const relayY = midY + 12;
    ctx.beginPath();
    ctx.moveTo(router.x, relayY);
    ctx.lineTo(client.x + client.w, relayY);
    ctx.stroke(); ctx.setLineDash([]);
    this._respPath = respPath; this._respY = respY; this._routerCx = routerCx;
    this._relayY = relayY;

    /* ---- KV 拉起传输动画: P→D 链路上的 KV 包(缓存拉起) ---- */
    for (let i = 0; i < sim.pList.length; i++){
      const p = sim.pList[i], link = p.link, pr = pRects[i];
      if (!link.current) continue;
      const di = sim.dList.indexOf(link.current.req.d);
      if (di < 0) continue;
      const dr = dRects[di];
      const x1 = pr.x + pr.w, y1 = pr.y + pr.h / 2, x2 = dr.x, y2 = dr.y + dr.h / 2;
      /* 活跃传输的 P→D 通道高亮 */
      curve(x1, y1, x2, y2, "rgba(78,161,255,0.95)", 2.2);
      const prog = clamp((now - link.startAt) / Math.max(1, link.doneAt - link.startAt), 0, 1);
      const mx = (x1 + x2) / 2;
      const bez = tt => {
        const u = 1 - tt;
        return {
          x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2,
          y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2,
        };
      };
      const mb = link.current.bytes / 2**20;
      const lw = clamp(2 + Math.log2(1 + mb) * 1.1, 2, 11);
      ctx.strokeStyle = COLORS.Transferring; ctx.lineWidth = lw; ctx.lineCap = "round";
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      const t0 = Math.max(0, prog - 0.07), pts = 8;
      let m0 = bez(t0); ctx.moveTo(m0.x, m0.y);
      for (let k = 1; k <= pts; k++){ const q = bez(t0 + (prog - t0) * k / pts); ctx.lineTo(q.x, q.y); }
      ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineCap = "butt";
      if (link.queue.length){
        ctx.fillStyle = COLORS.Transferring;
        ctx.fillText("⇥" + link.queue.length, x1 + 4, y1 - 6);
      }
      /* 包头部标记: 移动中的 KV 数据量 */
      const head = bez(Math.min(prog, 1));
      this.dot(head.x, head.y, 4, "#7ee0ff");
      ctx.fillStyle = "#7ee0ff"; ctx.font = "9px sans-serif";
      ctx.fillText(mb.toFixed(1) + " MB", head.x + 9, head.y - 7);
      ctx.font = "10px sans-serif";
    }
    /* 通道中央标识: 该蓝色通道即 D 从 P 拉起 KV cache */
    {
      const chMidX = (pX + boxW + dX) / 2;
      const kvLabel = t("edge.kvPull");
      ctx.font = "bold 10px sans-serif";
      const lw2 = ctx.measureText(kvLabel).width;
      ctx.fillStyle = "rgba(13,17,23,0.88)";
      this.rr(chMidX - lw2 / 2 - 8, midY - 13, lw2 + 16, 19, 9);
      ctx.fill();
      ctx.strokeStyle = "rgba(78,161,255,0.6)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#4ea1ff"; ctx.textAlign = "center";
      ctx.fillText(kvLabel, chMidX, midY + 1);
      ctx.textAlign = "left"; ctx.font = "10px sans-serif";
    }

    /* ---- 简单节点框 ---- */
    const drawNode = (r) => {
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.fillStyle = "#1c2330"; ctx.fill();
      ctx.strokeStyle = "#2d3646"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#e6edf3"; ctx.textAlign = "center"; ctx.font = "11px sans-serif";
      ctx.fillText(r.name, r.x + r.w / 2, r.y + r.h / 2 + 4);
      ctx.textAlign = "left";
    };
    drawNode(client); drawNode(router);

    /* ---- 新请求光点: client → router, 然后 router 双路派发到 P 与 D ---- */
    const bezPoint = (x1, y1, x2, y2, tt) => {
      const mx = (x1 + x2) / 2, u = 1 - tt;
      return {
        x: u*u*u*x1 + 3*u*u*tt*mx + 3*u*tt*tt*mx + tt*tt*tt*x2,
        y: u*u*u*y1 + 3*u*u*tt*y1 + 3*u*tt*tt*y2 + tt*tt*tt*y2,
      };
    };
    for (const r of sim.allActive){
      const age = now - r.stamps.recv;
      if (age < 0) continue;
      if (age <= CLIENT_VIS_MS){
        const prog = age / CLIENT_VIS_MS;
        const x = client.x + client.w + (router.x - client.x - client.w) * prog;
        this.dot(x, midY, 4, COLORS.tokenize);
      } else if (age <= CLIENT_VIS_MS + FANOUT_VIS_MS){
        const prog = (age - CLIENT_VIS_MS) / FANOUT_VIS_MS;
        const pi = sim.pList.indexOf(r.p), di = sim.dList.indexOf(r.d);
        const rx = router.x + router.w;
        if (pi >= 0){
          const pr = pRects[pi], pt = bezPoint(rx, midY, pr.x, pr.y + pr.h / 2, prog);
          this.dot(pt.x, pt.y, 3.5, "#f85149");
        }
        if (di >= 0){
          const dr = dRects[di], pt = bezPoint(rx, midY, dr.x, dr.y + dr.h / 2, prog);
          this.dot(pt.x, pt.y, 3.5, "#4ea1ff");
        }
      }
    }

    /* ---- 响应回流光点 D → router → client ---- */
    for (const r of sim.responding){
      const di = sim.dList.indexOf(r.d);
      if (di < 0) continue;
      const dr = dRects[di];
      const dToRouter = this._respPath(dr);
      const routerToClient = [
        { x: this._routerCx, y: router.y + router.h },
        { x: router.x, y: this._relayY },
        { x: client.x + client.w, y: this._relayY },
      ];
      const pts = dToRouter.concat(routerToClient);
      const prog = clamp(1 - (r.readyAt - now) / Math.max(1, sim.P.detokenizeMs), 0, 1);
      const pt = this.pathPoint(pts, prog);
      this.dot(pt.x, pt.y, 4, COLORS.tokenize);
    }

    /* ---- 实例盒子 ---- */
    for (let i = 0; i < sim.pList.length; i++)
      this.drawPrefill(sim, sim.pList[i], pRects[i], i, now);
    for (let i = 0; i < sim.dList.length; i++)
      this.drawDecode(sim, sim.dList[i], dRects[i], i, now);

    /* ---- legend ---- */
    const legend = [
      ["tokenize", COLORS.tokenize], ["Bootstrapping", COLORS.Bootstrapping],
      ["WaitingForInput", COLORS.WaitingForInput], ["Transferring", COLORS.Transferring],
      ["Success", COLORS.Success], ["decoding", COLORS.decoding], ["retract", COLORS.retract],
    ];
    let lx = 12;
    ctx.font = "10px sans-serif";
    for (const [k, c] of legend){
      this.dot(lx, 14, 4, c);
      ctx.fillStyle = "#8b98a9";
      const label = t("lg." + k);
      ctx.fillText(label, lx + 8, 17);
      lx += 16 + ctx.measureText(label).width + 10;
    }
  }

  drawPrefill(sim, p, r, idx, now){
    const ctx = this.ctx, P = sim.P;
    this.instanceFrame(r, t("n.prefill") + " " + p.id + (p.draining ? " ⏳" : ""));
    const tokCount = p.routingQ.reduce((s, q) => s + (q.stamps.tokenized > now ? 1 : 0), 0);
    let y = r.y + 26;
    this.queueRow(r, y, "q.tok", tokCount, COLORS.tokenize); y += 15;
    this.queueRow(r, y, "q.routing", p.routingQ.length - tokCount, COLORS.Bootstrapping); y += 15;
    this.queueRow(r, y, "q.waiting", p.waitingQ.length, COLORS.WaitingForInput); y += 15;
    const bx = r.x + 66, bw = r.w - 74;
    const slots = p.slots.length ? p.slots : [null];
    for (const slot of slots){
      ctx.fillStyle = "#8b98a9";
      ctx.fillText(t("q.prefilling"), r.x + 8, y + 8);
      this.rr(bx, y, bw, 10, 3); ctx.fillStyle = "#0d1117"; ctx.fill();
      if (slot){
        const req = slot.req;
        const dur = chunkPrefillMs(P, req, Math.min(req.chunksComputed, req.chunksTotal - 1));
        const frac = clamp(1 - (slot.busyUntil - now) / Math.max(1, dur), 0, 1);
        const prog = clamp((req.chunksComputed + frac) / req.chunksTotal, 0, 1);
        this.rr(bx, y, bw * prog, 10, 3); ctx.fillStyle = "#f0883e"; ctx.fill();
        ctx.fillStyle = "#e6edf3"; ctx.font = "9px sans-serif";
        ctx.fillText(req.uncachedLen + " tok · " + req.chunksComputed + "/" + req.chunksTotal, bx + 3, y + 8);
        ctx.font = "10px sans-serif";
      }
      y += 15;
    }
    this.queueRow(r, y, "q.inflight", p.inflight.length, COLORS.Transferring);
    this.kvGauge(r, p.kvUsed, p.maxTokens(P));
  }

  drawDecode(sim, d, r, idx, now){
    const ctx = this.ctx, P = sim.P;
    this.instanceFrame(r, t("n.decode") + " " + d.id + (d.draining ? " ⏳" : ""));
    if (now - d.retractGlow < 500){
      const a = 1 - (now - d.retractGlow) / 500;
      this.rr(r.x, r.y, r.w, r.h, 8);
      ctx.strokeStyle = "rgba(248,81,73," + (0.2 + 0.6 * a).toFixed(2) + ")";
      ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    }
    ctx.fillStyle = "#5a6675"; ctx.font = "8px sans-serif";
    const ntrTxt = "ntr " + d.ntr.toFixed(2);
    ctx.fillText(ntrTxt, r.x + r.w - 8 - ctx.measureText(ntrTxt).width, r.y + 27);
    ctx.font = "10px sans-serif";
    const tokCount = d.preallocQ.reduce((s, q) => s + (q.stamps.tokenized > now ? 1 : 0), 0);
    let y = r.y + 26;
    this.queueRow(r, y, "q.tok", tokCount, COLORS.tokenize); y += 15;
    this.queueRow(r, y, "q.prealloc", d.preallocQ.length - tokCount, COLORS.Bootstrapping); y += 15;
    /* KV Store 读取中(命中部分): 与拉起传输行同行, 显示在 count 左侧 */
    this.queueRow(r, y, "q.transfer", d.transferQ.length, COLORS.Transferring);
    const nRead = d.readQ.length + (d.readCurrent ? 1 : 0);
    if (nRead > 0){
      ctx.fillStyle = COLORS.Success; ctx.font = "9px sans-serif";
      const rt = "⇑" + nRead;
      ctx.fillText(rt, r.x + r.w - 26 - ctx.measureText(rt).width - 10, y + 8);
      ctx.font = "10px sans-serif";
    }
    y += 15;
    const nRetract = d.waitingQ.reduce((s, q) => s + (q.retracted ? 1 : 0), 0);
    this.queueRow(r, y, "q.waiting", d.waitingQ.length - nRetract, COLORS.Success);
    if (nRetract > 0){
      ctx.fillStyle = COLORS.retract; ctx.font = "9px sans-serif";
      const rt = "⟲" + nRetract;
      ctx.fillText(rt, r.x + r.w - 8 - ctx.measureText(rt).width, y + 8);
      ctx.font = "10px sans-serif";
    }
    y += 15;
    ctx.fillStyle = "#8b98a9";
    ctx.fillText(t("q.running"), r.x + 8, y + 8);
    const n = d.running.length;
    const maxDots = Math.floor((r.w - 110) / 7);
    for (let i = 0; i < Math.min(n, maxDots); i++)
      this.dot(r.x + 66 + i * 7, y + 5, 2.5, COLORS.decoding);
    ctx.fillStyle = COLORS.decoding;
    ctx.fillText(n + "/" + P.maxRunning, r.x + r.w - 44, y + 8);
    this.kvGauge(r, d.kvUsed, d.maxTokens(P));
  }

  instanceFrame(r, title){
    const ctx = this.ctx;
    this.rr(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = "#1c2330"; ctx.fill();
    ctx.strokeStyle = "#2d3646"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#e6edf3"; ctx.font = "bold 11px sans-serif";
    ctx.fillText(title, r.x + 8, r.y + 15);
    ctx.fillStyle = "#5a6675"; ctx.font = "8px sans-serif";
    const sub = t("inst.pipeline");
    ctx.fillText(sub, r.x + r.w - 8 - ctx.measureText(sub).width, r.y + 15);
    ctx.font = "10px sans-serif";
  }
  pathPoint(pts, prog){
    let total = 0;
    const segs = [];
    for (let i = 1; i < pts.length; i++){
      const l = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
      segs.push(l); total += l;
    }
    let rem = clamp(prog, 0, 1) * total;
    for (let i = 0; i < segs.length; i++){
      if (rem <= segs[i] || i === segs.length - 1){
        const f = segs[i] > 0 ? rem / segs[i] : 1;
        return { x: pts[i].x + (pts[i+1].x - pts[i].x) * f,
                 y: pts[i].y + (pts[i+1].y - pts[i].y) * f };
      }
      rem -= segs[i];
    }
    return pts[pts.length - 1];
  }
  queueRow(r, y, labelKey, count, color){
    const ctx = this.ctx;
    ctx.fillStyle = "#8b98a9";
    ctx.fillText(t(labelKey), r.x + 8, y + 8);
    const x0 = r.x + 66, maxDots = Math.floor((r.w - 110) / 8);
    for (let i = 0; i < Math.min(count, maxDots); i++)
      this.dot(x0 + i * 8, y + 5, 3, color);
    if (count > 0){
      ctx.fillStyle = color;
      ctx.fillText(String(count), r.x + r.w - 26, y + 8);
    }
  }
  kvGauge(r, used, cap){
    const ctx = this.ctx;
    const y = r.y + r.h - 12, x = r.x + 8, w = r.w - 16;
    const ratio = clamp(used / Math.max(1, cap), 0, 1);
    this.rr(x, y, w, 6, 3); ctx.fillStyle = "#0d1117"; ctx.fill();
    if (ratio > 0){ this.rr(x, y, Math.max(2, w * ratio), 6, 3); ctx.fillStyle = kvGaugeColor(ratio); ctx.fill(); }
    ctx.fillStyle = "#8b98a9"; ctx.font = "9px sans-serif";
    ctx.fillText("KV " + (ratio * 100).toFixed(0) + "%", x + w - 42, y - 2);
    ctx.font = "10px sans-serif";
  }
  dot(x, y, rad, color){
    const ctx = this.ctx;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  }
  rr(x, y, w, h, rad){
    const ctx = this.ctx;
    rad = Math.min(rad, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
}

/* ===================== Sparklines & breakdown ======================== */
function drawSpark(cv, data, color){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 160, h = cv.clientHeight || 34;
  if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  let max = -Infinity, any = false;
  for (const v of data) if (!Number.isNaN(v)){ any = true; if (v > max) max = v; }
  if (!any) return;
  if (max <= 0) max = 1;
  const n = data.length, pad = 2;
  ctx.strokeStyle = color; ctx.lineWidth = 1.4;
  ctx.beginPath();
  let pen = false, lastX = 0, lastY = 0;
  for (let i = 0; i < n; i++){
    const v = data[i];
    if (Number.isNaN(v)){ pen = false; continue; }
    const x = n > 1 ? (i / (n - 1)) * (w - pad * 2) + pad : w / 2;
    const y = h - pad - (v / max) * (h - pad * 2);
    if (!pen){ ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
    lastX = x; lastY = y;
  }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(lastX, lastY, 2, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

function drawBreakdown(cv, bd){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 86;
  if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "10px sans-serif";
  if (!bd){ ctx.fillStyle = "#8b98a9"; ctx.fillText("…", 6, 20); return; }
  const total = bd.reduce((a, b) => a + Math.max(0, b), 0) || 1;
  let x = 0;
  const barY = 6, barH = 24;
  for (let i = 0; i < BD_KEYS.length; i++){
    const seg = Math.max(0, bd[i]) / total * w;
    ctx.fillStyle = COLORS.bd[i];
    ctx.fillRect(x, barY, Math.max(seg, 0), barH);
    if (seg > 46){
      ctx.fillStyle = "#04121f"; ctx.font = "bold 10px sans-serif";
      ctx.fillText(fmtMs(bd[i]), x + 4, barY + 16);
      ctx.font = "10px sans-serif";
    }
    x += seg;
  }
  let lx = 2, ly = barY + barH + 18;
  for (let i = 0; i < BD_KEYS.length; i++){
    const label = t("bd." + BD_KEYS[i]) + " " + fmtMs(bd[i]);
    const lw = 12 + ctx.measureText(label).width + 14;
    if (lx + lw > w){ lx = 2; ly += 16; }
    ctx.fillStyle = COLORS.bd[i]; ctx.fillRect(lx, ly - 8, 8, 8);
    ctx.fillStyle = "#8b98a9"; ctx.fillText(label, lx + 12, ly);
    lx += lw;
  }
  ctx.fillStyle = "#e6edf3"; ctx.font = "bold 11px sans-serif";
  ctx.fillText("TTFT ≈ " + fmtMs(total), Math.max(2, w - 110), barY + 16);
}

function fmtMs(v){
  if (v === undefined || v === null || Number.isNaN(v)) return "—";
  if (v >= 10000) return (v / 1000).toFixed(1) + " s";
  if (v >= 100) return v.toFixed(0) + " ms";
  return v.toFixed(1) + " ms";
}
function fmtPct(v){ return Number.isNaN(v) ? "—" : (v * 100).toFixed(0) + "%"; }
function fmtNum(v){ return Number.isNaN(v) ? "—" : (v >= 100 ? v.toFixed(0) : v.toFixed(1)); }

/* ====================== Live app state & UI ========================= */
const P = Object.assign({}, DEFAULTS);
const sim = new SimEngine(P, (Math.random() * 1e9) | 0);
const renderer = new Renderer(document.getElementById("flow"));
let paused = false, timeScale = 1;

const METRIC_DEFS = [
  { key:"ttft", series:"ttft", color:"#4ea1ff",
    val:(s,l)=>fmtMs(s ? s.ttft.avg : NaN),
    sub:(s,l)=>s ? "p50 " + fmtMs(s.ttft.p50) + " · p99 " + fmtMs(s.ttft.p99) : "" },
  { key:"tpot", series:"tpot", color:"#bc8cff",
    val:(s,l)=>fmtMs(s ? s.tpot.avg : NaN),
    sub:(s,l)=>s ? "p50 " + fmtMs(s.tpot.p50) + " · p99 " + fmtMs(s.tpot.p99) : "" },
  { key:"e2e", series:"e2e", color:"#39c5cf",
    val:(s,l)=>fmtMs(s ? s.e2e.avg : NaN),
    sub:(s,l)=>s ? "p99 " + fmtMs(s.e2e.p99) : "" },
  { key:"rps", series:"rps", color:"#3fb950",
    val:(s,l)=>fmtNum(seriesMean("rps", 10)) + " ", unit:"u.reqs",
    sub:()=>"" },
  { key:"tps", series:"tps", color:"#3fb950",
    val:(s,l)=>fmtNum(seriesMean("tps", 10)) + " ", unit:"u.toks",
    sub:()=>"" },
  { key:"queue", series:"pQueue", color:"#7d8590",
    val:(s,l)=>fmtNum(l("pQueue")) + " / " + fmtNum(l("dQueue")),
    sub:()=>"" },
  { key:"running", series:"running", color:"#bc8cff",
    val:(s,l)=>fmtNum(l("running")), sub:()=>"" },
  { key:"inflight", series:"inflight", color:"#39c5cf",
    val:(s,l)=>fmtNum(l("inflight")), sub:()=>"" },
  { key:"dPull", series:"dPull", color:"#4ea1ff",
    val:(s,l)=>fmtNum(l("dPull")), sub:()=>"" },
  { key:"kvRead", series:"kvRead", color:"#d29922",
    val:(s,l)=>fmtNum(l("kvRead")), sub:()=>"" },
  { key:"kvP", series:"kvP", color:"#f0883e",
    val:(s,l)=>fmtPct(l("kvP")), sub:()=>"" },
  { key:"kvD", series:"kvD", color:"#f0883e",
    val:(s,l)=>fmtPct(l("kvD")),
    sub:(s,l)=>t("m.kvDpre.sub") + " " + fmtPct(l("kvDpre")) },
  { key:"kvDpre", series:"kvDpre", color:"#d29922",
    val:(s,l)=>fmtPct(l("kvDpre")), sub:()=>"" },
  { key:"dHandshake", series:"dHandshake", color:"#7ee787", unit:"u.ms",
    val:(s,l)=>fmtMs(s && s.dHandshake ? s.dHandshake.avg : NaN),
    sub:(s)=>s && s.dHandshake ? "p99 " + fmtMs(s.dHandshake.p99) : "" },
  { key:"link", series:"link", color:"#4ea1ff",
    val:(s,l)=>fmtPct(l("link")), sub:()=>"" },
];

function seriesMean(k, lastN){
  const m = sim.metrics;
  let sum = 0, n = 0;
  for (let back = 1; back <= Math.min(lastN, m.seriesCount); back++){
    const v = m.series[k][(m.seriesHead - back + SERIES_LEN) % SERIES_LEN];
    if (!Number.isNaN(v)){ sum += v; n++; }
  }
  return n ? sum / n : NaN;
}
function lastSeriesVal(k){
  const m = sim.metrics;
  for (let back = 1; back <= 5; back++){
    const idx = (m.seriesHead - back + SERIES_LEN) % SERIES_LEN;
    if (m.seriesCount >= back && !Number.isNaN(m.series[k][idx])) return m.series[k][idx];
  }
  return NaN;
}

function buildMetricCards(){
  const grid = document.getElementById("metrics");
  grid.innerHTML = "";
  for (const def of METRIC_DEFS){
    const card = document.createElement("div");
    card.className = "mcard";
    card.innerHTML =
      '<div class="mtitle" data-i18n="m.' + def.key + '"></div>' +
      '<div class="mval"><span id="mv_' + def.key + '">—</span>' +
      (def.unit ? ' <small data-i18n="' + def.unit + '"></small>' : "") + "</div>" +
      '<div class="msub" id="ms_' + def.key + '"></div>' +
      '<canvas id="mc_' + def.key + '"></canvas>';
    grid.appendChild(card);
  }
}

const METRIC_WINDOW_MS = 10000;
function updatePanels(){
  const snap = sim.metrics.snapshot(sim.now, METRIC_WINDOW_MS);
  for (const def of METRIC_DEFS){
    document.getElementById("mv_" + def.key).textContent = def.val(snap, lastSeriesVal);
    document.getElementById("ms_" + def.key).textContent = def.sub(snap, lastSeriesVal);
    drawSpark(document.getElementById("mc_" + def.key),
              sim.metrics.latestSeries(def.series), def.color);
  }
  drawBreakdown(document.getElementById("bd"), snap ? sim.metrics.recentBreakdown(10) : null);
  updateKvInfo();
  document.getElementById("simClock").textContent = "t = " + (sim.now / 1000).toFixed(1) + " s";
}

/* --------------------------- sidebar -------------------------------- */
function buildSidebar(){
  const el = document.getElementById("sidebar");
  el.innerHTML = "";
  for (const g of GROUPS){
    const div = document.createElement("div");
    div.className = "pgroup";
    const h = document.createElement("h3");
    h.dataset.i18n = "g." + g;
    div.appendChild(h);
    for (const def of PARAM_DEFS.filter(d => d.group === g)) div.appendChild(buildRow(def));
    if (g === "kv"){
      const info = document.createElement("div");
      info.className = "pinfo"; info.id = "kvInfo";
      div.appendChild(info);
    }
    el.appendChild(div);
  }
}
function buildRow(def){
  const row = document.createElement("div");
  row.className = "prow"; row.id = "row_" + def.key;
  const lab = document.createElement("div");
  lab.className = "plabel";
  const nm = document.createElement("span");
  nm.className = "pname"; nm.dataset.i18n = "p." + def.key;
  lab.appendChild(nm);
  if (def.type !== "select"){
    const val = document.createElement("span");
    val.className = "pval"; val.id = "val_" + def.key;
    lab.appendChild(val);
  }
  row.appendChild(lab);
  if (def.type === "toggle"){
    const btn = document.createElement("button");
    btn.id = "in_" + def.key; btn.style.width = "100%";
    const paint = () => {
      btn.classList.toggle("active", !!P[def.key]);
      btn.textContent = t(P[def.key] ? "toggle.on" : "toggle.off");
    };
    paint();
    btn.addEventListener("click", () => {
      P[def.key] = !P[def.key];
      paint(); refreshInputs();
    });
    row.appendChild(btn);
  } else if (def.type === "select"){
    const sel = document.createElement("select");
    sel.id = "in_" + def.key;
    for (const opt of def.options){
      const o = document.createElement("option");
      o.value = opt; o.dataset.i18n = def.i18nPrefix + opt;
      sel.appendChild(o);
    }
    sel.value = P[def.key];
    sel.addEventListener("change", () => {
      P[def.key] = sel.value;
      if (def.key === "modelPreset") applyModelPreset(sel.value);
      if (def.key === "gpu") applyGpuPreset(sel.value);
    });
    row.appendChild(sel);
  } else {
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "in_" + def.key;
    if (def.steps){
      inp.min = 0; inp.max = def.steps.length - 1; inp.step = 1;
      inp.value = nearestStepIdx(def, P[def.key]);
    } else if (def.log){
      inp.min = 0; inp.max = LOG_STEPS; inp.step = 1;
      inp.value = logValToSlider(def, P[def.key]);
    } else {
      inp.min = def.min; inp.max = def.max; inp.step = def.step;
      inp.value = P[def.key];
    }
    inp.addEventListener("input", () => {
      P[def.key] = def.steps ? def.steps[parseInt(inp.value)]
                 : def.log ? logSliderToVal(def, parseFloat(inp.value)) : parseFloat(inp.value);
      document.getElementById("val_" + def.key).textContent = def.fmt(P[def.key]);
      if (["layers","kvHeads","headDim","dtypeBytes"].includes(def.key)){ P.modelPreset = "custom"; syncSelect("modelPreset"); }
      if (["kvGbP","kvGbD"].includes(def.key)){ P.gpu = "custom"; syncSelect("gpu"); }
    });
    row.appendChild(inp);
  }
  return row;
}
function applyModelPreset(name){
  if (name !== "custom" && !MODEL_PRESETS[name]) name = DEFAULTS.modelPreset;
  P.modelPreset = name;
  if (name !== "custom"){
    const m = MODEL_PRESETS[name];
    P.layers = m.layers; P.kvHeads = m.kvHeads; P.headDim = m.headDim;
    P.dtypeBytes = m.dtypeBytes; P.mla = !!m.mla;
    P.hybrid = !!m.hybrid; P.fullLayers = m.fullLayers || m.layers;
    P.activeB = m.activeB; P.qHeads = m.qHeads || 32;
    P.swaWindow = m.hybrid ? (m.swaWindow || 0) : 0;
    if (m.mla){ P.kvLoraRank = m.kvLoraRank; P.qkRope = m.qkRope; }
  } else {
    P.mla = false; P.hybrid = false; P.swaWindow = 0;
  }
  refreshInputs();
}
function applyGpuPreset(name){
  if (name !== "custom"){
    const kv = gpuKvBudget(GPU_PRESETS[name].hbm);
    P.kvGbP = kv; P.kvGbD = kv;
  }
  refreshInputs();
}
function syncSelect(key){
  const sel = document.getElementById("in_" + key);
  if (sel) sel.value = P[key];
}
function refreshInputs(){
  for (const def of PARAM_DEFS){
    const inp = document.getElementById("in_" + def.key);
    if (!inp) continue;
    const row = document.getElementById("row_" + def.key);
    if (def.type === "toggle"){
      inp.classList.toggle("active", !!P[def.key]);
      inp.textContent = t(P[def.key] ? "toggle.on" : "toggle.off");
    } else {
      inp.value = def.steps ? nearestStepIdx(def, P[def.key])
                : def.log ? logValToSlider(def, P[def.key]) : P[def.key];
      if (def.type !== "select")
        document.getElementById("val_" + def.key).textContent = def.fmt(P[def.key]);
    }
    if (def.customOnly)
      row.style.display = P.modelPreset === "custom" ? "" : "none";
  }
}
function updateKvInfo(){
  const cell = cellSizeOf(P);
  const capP = Math.floor(P.kvGbP * 2**30 / cell);
  const capD = Math.floor(P.kvGbD * 2**30 / cell);
  const fmtTok = v => v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : (v / 1e3).toFixed(0) + "k";
  document.getElementById("kvInfo").innerHTML =
    t("info.cell") + ": <b>" + (cell / 1024).toFixed(1) + " KB</b>" + t("info.perTok") +
    (P.mla ? " (MLA)" : "") + "<br>" +
    t("info.capP") + ": <b>" + fmtTok(capP) + "</b> " + t("info.tokens") + " · " +
    t("info.capD") + ": <b>" + fmtTok(capD) + "</b> " + t("info.tokens");
}

/* --------------------------- top bar -------------------------------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".preset").forEach(b => {
    b.textContent = t("preset." + b.dataset.preset);
  });
  updatePauseLabel();
  document.getElementById("btnStep").textContent = t("ctl.step");
  document.getElementById("btnReset").textContent = t("ctl.reset");
  document.getElementById("btnLang").textContent = LANG === "zh" ? "EN" : "中文";
  document.documentElement.lang = LANG;
  refreshInputs();
}
function updatePauseLabel(){
  document.getElementById("btnPause").textContent = t(paused ? "ctl.resume" : "ctl.pause");
}
function wireTopbar(){
  document.getElementById("btnPause").addEventListener("click", () => {
    paused = !paused; updatePauseLabel();
  });
  document.getElementById("btnStep").addEventListener("click", () => {
    if (!paused){ paused = true; updatePauseLabel(); }
    sim.advance(100); updatePanels();
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    sim.reset(); updatePanels();
  });
  const speed = document.getElementById("speed");
  const setSpeed = () => {
    timeScale = Math.pow(2, parseFloat(speed.value));
    document.getElementById("speedVal").textContent =
      (timeScale >= 1 ? timeScale.toFixed(timeScale >= 8 ? 0 : 1) : timeScale.toFixed(2)) + "×";
  };
  speed.addEventListener("input", setSpeed); setSpeed();
  document.querySelectorAll(".preset").forEach(b => {
    b.addEventListener("click", () => {
      Object.assign(P, PRESETS[b.dataset.preset]);
      applyModelPreset(P.modelPreset);
      document.querySelectorAll(".preset").forEach(x => x.classList.toggle("active", x === b));
    });
  });
  document.getElementById("btnLang").addEventListener("click", () => {
    LANG = LANG === "zh" ? "en" : "zh";
    applyI18n(); updatePanels();
  });
  document.getElementById("sidebarToggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  });
}

/* --------------------------- main loop ------------------------------ */
let lastTs = 0, lastPanel = 0;
function frame(ts){
  if (!lastTs) lastTs = ts;
  const dt = Math.min(100, ts - lastTs);
  lastTs = ts;
  if (!paused) sim.advance(dt * timeScale);
  renderer.resize(sim);
  renderer.draw(sim);
  if (ts - lastPanel > 250){ lastPanel = ts; updatePanels(); }
  requestAnimationFrame(frame);
}

function boot(){
  buildSidebar();
  buildMetricCards();
  wireTopbar();
  refreshInputs();
  applyI18n();
  const qs = new URLSearchParams(location.search);
  if (DICT[qs.get("lang")]){ LANG = qs.get("lang"); applyI18n(); }
  const pr = qs.get("preset");
  if (pr && PRESETS[pr]){
    Object.assign(P, PRESETS[pr]);
    applyModelPreset(P.modelPreset);
  }
  if (qs.has("modelPreset")) applyModelPreset(qs.get("modelPreset"));
  if (GPU_PRESETS[qs.get("gpu")]){ P.gpu = qs.get("gpu"); applyGpuPreset(P.gpu); }
  for (const [k, v] of qs){
    if (k in DEFAULTS && !["preset","warmup","lang","modelPreset","gpu"].includes(k)){
      const d = DEFAULTS[k];
      P[k] = (typeof d === "number") ? parseFloat(v)
           : (typeof d === "boolean") ? (v === "true" || v === "1") : v;
      if (["layers","kvHeads","headDim","dtypeBytes"].includes(k)) P.modelPreset = "custom";
      if (["kvGbP","kvGbD"].includes(k)) P.gpu = "custom";
    }
  }
  refreshInputs();
  const wu = parseFloat(qs.get("warmup"));
  if (wu > 0) sim.advance(wu * 1000);
  updatePanels();
  requestAnimationFrame(frame);
  console.log("%cvLLM P/D 分离模拟器 · GLM5.1 请求链路", "font-weight:bold");
  console.log("Run runSelfTest() in this console to execute the headless invariant checks.");
}
window.runSelfTest = runSelfTest;
window.addEventListener("resize", () => { /* canvas resizes on next frame */ });
boot();
</script>
